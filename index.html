  <script>
    window.addEventListener('error', function(e) {
      fetch('/api/client-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error ? e.error.stack : null })
      }).catch(function(){});
    });
    window.addEventListener('unhandledrejection', function(e) {
      fetch('/api/client-error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ unhandledRejection: e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : null })
      }).catch(function(){});
    });
    /* Before first paint: the saved theme and the folded sidebar, so a reload
       never flashes. Under ?record the page waits for the rig and ignores saved
       choices; a recorder hands the theme over as ?theme=. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      if (rec && /[?&]theme=dark\b/.test(location.search)) d.dataset.theme = 'dark';
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('marlo:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (localStorage.getItem('marlo:rail') === '1') d.classList.add('is-rail');
        }
      } catch (e) {}
      if (d.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111213');
    })(document.documentElement);
  </script>
